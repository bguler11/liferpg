name: Hatırlatma gönder

on:
  # Saat başı çalışır; kime gideceğine script karar verir (cihazın saat dilimi + seçilen saat).
  # GitHub cron'u yoğunlukta birkaç dakika gecikebilir, script 3 saatlik pencere bırakır.
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sadece kimlere gideceğini yaz, bildirim gönderme'
        type: boolean
        default: false

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: tools
      - run: node send-reminders.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: tools
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
